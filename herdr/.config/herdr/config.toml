onboarding = false

[ui]
# Pane frame borders use `accent`; dropped here so panes separate by gaps instead.
# (The subtle divider lines are colored separately via [theme.custom] surface_dim.)
pane_borders = true
pane_gaps = false
pane_scrollbars = false
sidebar_collapsed_mode = "hidden"

# active_pane_border = "plain"   # default: "thick" | "plain"

tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/scripts/status.sh", interval_seconds = 5, timeout_seconds = 2 },
]

tab_bar_right_separator = " · "

# herdr 0.7.4 packs sidebar rows by default; row_gap = 1 restores the old (spaced)
# look — separately for the agent panel and the spaces/workspace panel.
[ui.sidebar.agents]
row_gap = 1

[ui.sidebar.spaces]
row_gap = 1

# ╒══════════════════════════════════════════════════════════════════════════════╕
#                                   KEYBINDINGS
# ╘══════════════════════════════════════════════════════════════════════════════╛

[keys]
prefix = "ctrl+space"
copy_mode = "prefix+shift+v"

# +------------------------------------------------------------------------------+
# | WORKSPACES (aka session in tmux)                                             |
# +------------------------------------------------------------------------------+

new_workspace = "prefix+shift+n"
previous_workspace = "prefix+ctrl+k"
next_workspace = "prefix+ctrl+j"
close_workspace = "prefix+shift+x"
switch_workspace = "prefix+1..9"
workspace_picker = "prefix+w"

goto = ""

navigate_workspace_up = ["k", "ctrl+p"]
navigate_workspace_down = ["j", "ctrl+n"]

new_worktree = ""

# +------------------------------------------------------------------------------+
# | TABS (aka window in tmux)                                                    |
# +------------------------------------------------------------------------------+

new_tab = "alt+shift+n"

next_tab = "alt+ctrl+l"
previous_tab = "alt+ctrl+h"

move_tab_previous = "alt+ctrl+Left"
move_tab_next = "alt+ctrl+Right"

# +------------------------------------------------------------------------------+
# | PANE                                                                         |
# +------------------------------------------------------------------------------+

split_vertical = ["prefix+l", "prefix+enter"]
split_horizontal = ["prefix+j", "prefix+shift+enter"]
zoom = "alt+shift+m"
last_pane = "prefix+;"  # tmux last-pane | default: "" (unset)

# focus_pane_left = "alt+h"  # tmux h/j/k/l  | default: "prefix+h" (unchanged)
# focus_pane_down = "alt+j"  #               | default: "prefix+j" (unchanged)
# focus_pane_up = "alt+k"    #               | default: "prefix+k" (unchanged)
# focus_pane_right = "alt+l" #               | default: "prefix+l" (unchanged)

# ├──────────────────────────────┤ NAVIGATE PANE ├────────────────────────────┤

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

# +------------------------------------------------------------------------------+
# | MISC or CUSTOM BINDING                                                       |
# +------------------------------------------------------------------------------+

[[keys.command]]
key = "alt+shift+b"
type = "popup"
command = "btop"
description = "open btop"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+shift+s"
type = "popup"
command = "tmr"
description = "select session"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+shift+c"
type = "popup"
command = "bash -i -c 'r_kill'"
description = "open rkill"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+shift+g"
type = "popup"
command = "lazygit --use-config-file $HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/theme/fla.yml"
description = "open lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+shift+w"
type = "popup"
command = "fz-ctrlherdr"
description = "open note float"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+shift+z"
type = "popup"
command = "resterm"
description = "open resterm"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+shift+d"
type = "popup"
command = "lazydocker"
description = "open lazydocker"
width = "80%"
height = "80%"

# install: herdr plugin install meerzulee/herdr-float --yes
# [[keys.command]]
# key = "alt+shift+t"
# type = "plugin_action"
# command = "herdr-float.toggle"
# description = "Toggle floating scratch shell"

[[keys.command]]
key = "alt+f"
type = "shell"
command = "hd-toggle-pane handle_split_term"
description = "Toggle Split term"

