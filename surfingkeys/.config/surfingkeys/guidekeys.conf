###############################################################################
# LINK
###############################################################################

# Use:`prefix` -> <ctrl-space>
# Cara define mapping di surfingkeys, perhatikan huruf besar pada Ctrl, Space, Alt:
# - Jangan gunakan `<ctrl-s>` tapi `<Ctrl-s>`
# - Jangan gunakan `<Alt-Ctrl-Left>` tapi `<Ctrl-Alt-Left>`

# link: follow link
f

# link: follow link with non-active new tab
F

# link: edit current url/http
<Prefix>E

# link: open multiple links in a new tab
<M-f>

# link: follow link with glance
# <M-f>

# link: navigate link, go to root url
gU

# link: navigate link, go up one path in the URL
gu


