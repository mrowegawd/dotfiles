# vim: foldmethod=marker foldlevel=0 ft=ini
# ============================================================================
# TMUX CONFIG
# ============================================================================
#
# Workflow:
#   Prefix        : C-Space
#   Pane movement : M-h/j/k/l
#   Resize mode   : Prefix + r, then h/j/k/l
#   Copy mode     : Prefix + V
#
# External scripts:
#   ~/.config/miscxrdb/bin/
#
# ============================================================================

set -s theme terminal

# ============================================================================
# CORE
# ============================================================================

# ----------------------------------------------------------------------------
# Terminal
# ----------------------------------------------------------------------------
#
# tmux should expose a tmux terminal type to applications instead of
# forwarding the outer terminal's $TERM directly.
#
# True color is advertised separately through terminal-features.
#

set -g default-terminal "tmux-256color"

# True color / RGB.

set -as terminal-features ",*:RGB"

# Extended keyboard modifiers.

set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Allow applications such as Neovim to receive terminal focus events.

set -g focus-events on

# Reduce Escape / Alt key latency.

set -s escape-time 0


# ----------------------------------------------------------------------------
# General
# ----------------------------------------------------------------------------

set -g mouse on

set -g history-limit 50000

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g detach-on-destroy off

set -g bell-action none
set -g visual-activity off
set -g visual-bell off

set -g status-left-length 20

setw -g automatic-rename on
# setw -g aggressive-resize on

set -g set-titles on
set -g set-titles-string "tmux:#I #W"


# ----------------------------------------------------------------------------
# Shell
# ----------------------------------------------------------------------------
#
# Only override the shell on WSL when /usr/bin/zsh actually exists.

if-shell '[ -f /proc/version ] && grep -qi microsoft /proc/version && [ -x /usr/bin/zsh ]' \
    'set-option -g default-shell /usr/bin/zsh'


# ============================================================================
# PREFIX
# ============================================================================

# Remove tmux defaults.

unbind C-b
unbind C-a

# Main prefix.

set -g prefix C-Space

# Time allowed between keys of a repeatable binding.

set -g repeat-time 600


# ============================================================================
# VI MODE
# ============================================================================

set -g status-keys vi
setw -g mode-keys vi


# ============================================================================
# CUSTOM STATE
# ============================================================================

# State used by the custom copy-mode selection logic.

set -g @mode "NORMAL"


# ============================================================================
# NAVIGATION
# ============================================================================

# ----------------------------------------------------------------------------
# Application detection
# ----------------------------------------------------------------------------
#
# These shell expressions are intentionally kept because they are also used
# by the application-aware M-* bindings below.

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_yazi="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\\S+\\/)?g?(view|n?yazi?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\\S+\\/)?g?(view|n?fzf?x?)(diff)?$'"


# ----------------------------------------------------------------------------
# Smart pane navigation
# ----------------------------------------------------------------------------
#
# If the active pane is Neovim, forward M-h/j/k/l to Neovim.
# Otherwise move between tmux panes.

bind -n M-h \
    if -F '#{@pane-is-vim}' \
    'send-keys M-h' \
    'select-pane -LZ'

bind -n M-j \
    if -F '#{@pane-is-vim}' \
    'send-keys M-j' \
    'select-pane -DZ'

bind -n M-k \
    if -F '#{@pane-is-vim}' \
    'send-keys M-k' \
    'select-pane -UZ'

bind -n M-l \
    if -F '#{@pane-is-vim}' \
    'send-keys M-l' \
    'select-pane -RZ'


# ============================================================================
# RESIZE
# ============================================================================

# Enter resize mode.

bind r switch-client -T resize

# Resize repeatedly while staying in resize mode.

bind -T resize -r h resize-pane -L 2
bind -T resize -r j resize-pane -D 2
bind -T resize -r k resize-pane -U 2
bind -T resize -r l resize-pane -R 2

# Exit resize mode.

bind -T resize q      switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize Enter  switch-client -T root


# ============================================================================
# COPY MODE
# ============================================================================

# ----------------------------------------------------------------------------
# Enter copy mode
# ----------------------------------------------------------------------------

unbind v
unbind V

# Prefix + V -> copy mode.
bind V copy-mode


# ----------------------------------------------------------------------------
# Copy mode pane navigation
# ----------------------------------------------------------------------------

bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R


# ----------------------------------------------------------------------------
# Copy mode utility
# ----------------------------------------------------------------------------

# Prefix + M-x inside copy mode -> kill pane.
bind -T copy-mode-vi M-x kill-pane


# ----------------------------------------------------------------------------
# Page scrolling
# ----------------------------------------------------------------------------

bind -n Pageup \
    if -F "#{@pane-is-vim} || $is_fzf" \
    "send-keys Pageup" \
    "copy-mode \\; send-keys -X halfpage-up"

bind -n Pagedown \
    if -F "#{@pane-is-vim} || $is_fzf" \
    "send-keys Pagedown" \
    "copy-mode \\; send-keys -X halfpage-down"


# ----------------------------------------------------------------------------
# Disable Space as a copy-mode action.
# ----------------------------------------------------------------------------

bind -T copy-mode-vi Space send-keys -X cancel


# ----------------------------------------------------------------------------
# Exit copy mode / clear selection
# ----------------------------------------------------------------------------
#
# Escape, C-c and q behave consistently:
#
#   selection exists -> clear selection
#   no selection      -> leave copy mode
#

bind-key -T copy-mode-vi Escape {
    if-shell -F '#{selection_present}' {
        send-keys -X rectangle-off
        send-keys -X clear-selection
        set-option -g @mode "NORMAL"
    } {
        send-keys -X cancel
        set -p -t ! pane-scrollbars off
        set-option -g @mode "NORMAL"
    }
}

bind-key -T copy-mode-vi C-c {
    if-shell -F '#{selection_present}' {
        send-keys -X rectangle-off
        send-keys -X clear-selection
        set-option -g @mode "NORMAL"
    } {
        send-keys -X cancel
        set -p -t ! pane-scrollbars off
        set-option -g @mode "NORMAL"
    }
}

bind-key -T copy-mode-vi q {
    if-shell -F '#{selection_present}' {
        send-keys -X rectangle-off
        send-keys -X clear-selection
        set-option -g @mode "NORMAL"
    } {
        send-keys -X cancel
        set -p -t ! pane-scrollbars off
        set-option -g @mode "NORMAL"
    }
}


# ----------------------------------------------------------------------------
# Visual mode
# ----------------------------------------------------------------------------

bind-key -T copy-mode-vi v {
    if-shell -F '#{selection_present}' {
        send-keys -X rectangle-off
        send-keys -X clear-selection
        set-option -g @mode "NORMAL"
    } {
        send-keys -X rectangle-off
        send-keys -X begin-selection
        set-option -g @mode "VISUAL"
    }
}


# ----------------------------------------------------------------------------
# Visual block mode
# ----------------------------------------------------------------------------

bind-key -T copy-mode-vi C-v {
    if-shell -F '#{selection_present}' {
        if-shell -F '#{==:#{@mode},VISUAL}' {
            send-keys -X rectangle-on
            set-option -g @mode "VISUAL_BLOCK"
        } {
            send-keys -X rectangle-off
            send-keys -X clear-selection
            set-option -g @mode "NORMAL"
        }
    } {
        send-keys -X rectangle-on
        send-keys -X begin-selection
        set-option -g @mode "VISUAL_BLOCK"
    }
}


# ----------------------------------------------------------------------------
# Visual line mode
# ----------------------------------------------------------------------------

bind-key -T copy-mode-vi V {
    if-shell -F '#{selection_present}' {
        if-shell -F '#{||:#{==:#{@mode},VISUAL},#{==:#{@mode},VISUAL_BLOCK}}' {
            send-keys -X rectangle-off
            send-keys -X select-line
            set-option -g @mode "VISUAL_LINE"
        } {
            send-keys -X clear-selection
            set-option -g @mode "NORMAL"
        }
    } {
        send-keys -X rectangle-off
        send-keys -X select-line
        set-option -g @mode "VISUAL_LINE"
    }
}


# ----------------------------------------------------------------------------
# Copy-mode navigation helpers
# ----------------------------------------------------------------------------

bind -T copy-mode-vi C-b \
    send-keys -X start-of-line \; \
    send-keys -X search-backward ']'

bind -T copy-mode-vi B \
    send-keys -X start-of-line \; \
    send-keys -X search-forward ']'

bind -T copy-mode-vi N send-keys -X search-reverse
bind -T copy-mode-vi n send-keys -X search-again

bind -T copy-mode-vi Y send-keys -X copy-end-of-line


# ============================================================================
# CLIPBOARD
# ============================================================================

# macOS
if-shell "uname | grep -q Darwin" {
    bind-key -T copy-mode-vi y \
        send-keys -X copy-pipe-no-clear \
        'reattach-to-user-namespace pbcopy' \; \
        display-message "Copied to clipboard"

    bind-key -T copy-mode-vi Enter \
        send-keys -X copy-pipe-and-cancel \
        'reattach-to-user-namespace pbcopy' \; \
        display-message "Copied to clipboard"
} {
    # Linux / X11
    bind-key -T copy-mode-vi y \
        send-keys -X copy-pipe-no-clear \
        'xclip -in -selection clipboard' \; \
        display-message "Copied to clipboard"

    bind-key -T copy-mode-vi Enter \
        send-keys -X copy-pipe-and-cancel \
        'xclip -in -selection clipboard' \; \
        display-message "Copied to clipboard"
}


# ============================================================================
# MOUSE
# ============================================================================

# ----------------------------------------------------------------------------
# Double / triple click outside copy mode
# ----------------------------------------------------------------------------

bind -T root DoubleClick1Pane \
    if -Ft'{mouse}' '#{alternate_on}' \
    "send-keys -M" \
    "copy-mode -t'{mouse}'; send-keys -t'{mouse}' -X select-word"

bind -T root TripleClick1Pane \
    if -Ft'{mouse}' '#{alternate_on}' \
    "send-keys -M" \
    "copy-mode -t'{mouse}'; send-keys -t'{mouse}' -X select-line"


# ----------------------------------------------------------------------------
# Double / triple click inside copy mode
# ----------------------------------------------------------------------------

bind-key -T copy-mode-vi DoubleClick1Pane \
    if -Ft'{mouse}' '#{alternate_on}' \
    "send-keys -M" \
    "copy-mode -t'{mouse}'; send-keys -t'{mouse}' -X select-word"

bind-key -T copy-mode-vi TripleClick1Pane \
    if -Ft'{mouse}' '#{alternate_on}' \
    "send-keys -M" \
    "copy-mode -t'{mouse}'; send-keys -t'{mouse}' -X select-line"


# Drag selection -> clipboard.
bind-key -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe-and-cancel \
    'xclip -in -selection clipboard'


# ============================================================================
# BUFFER
# ============================================================================

# Choose copy buffer.
bind F9 choose-buffer \; \
    display-message "Choose copy buffer mode..."

# Delete current history buffer.
bind - delete-buffer \; \
    display-message "History cleared..."


# ============================================================================
# COPY MODE SEARCH
# ============================================================================

# Search down from normal tmux mode.
bind-key / {
    copy-mode -H
    command-prompt -i \
        -I "#{pane_search_string}" \
        -T search \
        -p "(search down)" \
        'send-keys -X search-forward-incremental "%%"'
}

# Search up from normal tmux mode.
bind-key ? {
    copy-mode -H
    command-prompt -i \
        -I "#{pane_search_string}" \
        -T search \
        -p "(search up)" \
        'send-keys -X search-backward-incremental "%%"'
}

# Search down inside copy mode.
bind-key -T copy-mode-vi / \
    command-prompt -i \
        -I "#{pane_search_string}" \
        -T search \
        -p "(search down)" \
        'send-keys -X search-forward-incremental "%%"'

# Search up inside copy mode.
bind-key -T copy-mode-vi ? \
    command-prompt -i \
        -I "#{pane_search_string}" \
        -T search \
        -p "(search up)" \
        'send-keys -X search-backward-incremental "%%"'


# ============================================================================
# PANES
# ============================================================================

# Show pane numbers.
bind Q display-panes

# Kill pane.
bind x kill-pane

# Alt+x:
#   Neovim -> send M-x
#   otherwise -> kill pane
bind -n M-x \
    if -F '#{@pane-is-vim}' \
    'send-keys M-x' \
    'kill-pane'

bind -n M-F5 run-shell \
    "$HOME/.config/miscxrdb/bin/tm-markthis select"

bind -n M-F8 run-shell \
    "$HOME/.config/miscxrdb/bin/tm-markthis mark"

bind -n M-I run-shell \
    "$HOME/.config/miscxrdb/bin/tm-markthis next"

bind -n M-O run-shell \
    "$HOME/.config/miscxrdb/bin/tm-markthis prev"

# ----------------------------------------------------------------------------
# Split
# ----------------------------------------------------------------------------

# Vertical split.
bind l run-shell \
    "$HOME/.config/miscxrdb/bin/tm-toggle-pane open_vsplit"

# Horizontal split.
bind j run-shell \
    "$HOME/.config/miscxrdb/bin/tm-toggle-pane open_split"


# ----------------------------------------------------------------------------
# Pane UI
# ----------------------------------------------------------------------------

# Toggle zoom + pane bar.
bind -n M-M run-shell \
    "$HOME/.config/miscxrdb/bin/tm-pane-bar-toggle toggle_zoom_and_hide_bar_pane"

# Reset pane workspaces.
bind -n M-w run-shell \
    "$HOME/.config/miscxrdb/bin/tm-toggle-pane reset_pane_workspaces"


# ----------------------------------------------------------------------------
# Rotate / move panes
# ----------------------------------------------------------------------------

bind -n M-R \
    rotate-window -D \; \
    select-pane -t :.+


# ----------------------------------------------------------------------------
# Join pane to window
# ----------------------------------------------------------------------------

bind -n M-! join-pane -v -t :=1
bind -n M-@ join-pane -v -t :=2
bind -n M-# join-pane -v -t :=3
bind -n M-$ join-pane -v -t :=4
bind -n M-% join-pane -v -t :=5
bind -n M-^ join-pane -v -t :=6
bind -n M-& join-pane -v -t :=7
bind -n M-* join-pane -v -t :=8


# ----------------------------------------------------------------------------
# Swap pane
# ----------------------------------------------------------------------------

bind -n M-S-Left \
    splitw -fhb \; \
    swapp -t ! \; \
    killp -t !

bind -n M-S-Down \
    splitw -fv \; \
    swapp -t ! \; \
    killp -t !

bind -n M-S-Up \
    splitw -fvb \; \
    swapp -t ! \; \
    killp -t !

bind -n M-S-Right \
    splitw -fh \; \
    swapp -t ! \; \
    killp -t !


# ============================================================================
# WINDOWS
# ============================================================================

# Swap window left.
bind -n M-C-Left \
    swap-window -d -t '{previous}'

# Swap window right.
bind -n M-C-Right \
    swap-window -d -t '{next}'

# Next window.
bind -n M-C-l next

# Previous window.
bind -n M-C-h prev

# Kill window.
bind -n M-X \
    confirm-before \
    -p "kill window '#W'? (y/n)" \
    kill-window

# New window in current pane directory.
bind -n M-N \
    new-window -c "#{pane_current_path}"

# Rename window.
bind -r T \
    command-prompt -I "#W" \
    "rename-window -- '%%'"


# ============================================================================
# SESSIONS
# ============================================================================

# Last session.
bind -r b \
    run-shell \
    "if $is_yazi; then tmux send-keys M-b; else tmux run-shell -b \"$HOME/.config/miscxrdb/bin/tm-toggle-pane last_session\"; fi"

# Select / create session.
bind -r s \
    run-shell \
    "$HOME/.config/tmuxconfig/scripts/select-sesh"

# Next session.
bind -n C-j switch-client -n

# Previous session.
bind -r C-k switch-client -p

# Detach.
bind -r q detach

# Kill current session and switch to next.
bind -r X \
    run-shell \
    'tmux switch-client -n \; kill-session -t "#S"'


# ============================================================================
# HOOKS
# ============================================================================

# Automatically resize active pane according to custom workflow.
set-hook -g pane-focus-in \
    "run-shell -b '$HOME/.config/miscxrdb/bin/tm-toggle-pane auto_resize_pane'"


# ============================================================================
# CUSTOM APPLICATION BINDINGS
# ============================================================================

# ----------------------------------------------------------------------------
# Terminal
# ----------------------------------------------------------------------------

bind -n M-v \
    run-shell \
    "$HOME/.config/miscxrdb/bin/tm-toggle-pane handle_split_term"


# ----------------------------------------------------------------------------
# Notes / todo
# ----------------------------------------------------------------------------

# bind -n M-S-F8 \
#     run-shell \
#     "if $is_fzf; then tmux send-keys M-S-F8; else tmux run-shell -b \"$HOME/.config/miscxrdb/bin/tm-toggle-pane handle_show_notes\"; fi"


# ----------------------------------------------------------------------------
# Ctrl-O / file picker
# ----------------------------------------------------------------------------

bind -n M-Y \
    run-shell \
    "if $is_yazi || $is_fzf; then tmux send-keys M-Y; else tmux run-shell -b \"$HOME/.config/miscxrdb/bin/fz-ctrlo callme\"; fi"


# ----------------------------------------------------------------------------
# File manager
# ----------------------------------------------------------------------------

bind -n M-e \
    run-shell \
    "if $is_yazi || $is_fzf || $is_vim; then tmux send-keys M-e; else tmux run-shell -b \"$HOME/.config/miscxrdb/bin/tm-toggle-pane handle_open_filetree\"; fi"


# ----------------------------------------------------------------------------
# Notes
# ----------------------------------------------------------------------------

bind -n M-W \
    run-shell \
    "$HOME/.config/miscxrdb/bin/fz-ctrlo open_notes"


# ----------------------------------------------------------------------------
# Reload config
# ----------------------------------------------------------------------------

bind R \
    source-file "$HOME/.tmux.conf" \; \
    display-message "Tmux config reloaded"


# ----------------------------------------------------------------------------
# btop
# ----------------------------------------------------------------------------

bind -n M-B \
    run-shell \
    "if $is_fzf; then tmux send-keys M-B; else tmux run-shell -b \"$HOME/.config/miscxrdb/bin/fz-ctrlo open_ps_btop\"; fi"

# ----------------------------------------------------------------------------
# Floating terminal
# ----------------------------------------------------------------------------

bind -n M-T \
    run-shell \
    "if $is_yazi || $is_fzf || $is_vim; then tmux send-keys M-T; else tmux run-shell -b \"$HOME/.config/miscxrdb/bin/tm-toggle-pane float_term\"; fi"


# ----------------------------------------------------------------------------
# rkill
# ----------------------------------------------------------------------------

bind -n M-C \
    run-shell \
    "$HOME/.config/miscxrdb/bin/fz-ctrlo open_rkill"


# ----------------------------------------------------------------------------
# resterm
# ----------------------------------------------------------------------------

bind -n M-Z \
    run-shell \
    "$HOME/.config/miscxrdb/bin/fz-ctrlo open_resterm"


# ----------------------------------------------------------------------------
# lazygit
# ----------------------------------------------------------------------------

bind -n M-G \
    run-shell \
    "if $is_yazi; then tmux send-keys M-G; else tmux run-shell -b \"$HOME/.config/miscxrdb/bin/fz-ctrlo open_lazygit\"; fi"


# ----------------------------------------------------------------------------
# lazydocker
# ----------------------------------------------------------------------------

bind -n M-D \
    run-shell \
    "$HOME/.config/miscxrdb/bin/fz-ctrlo open_lazydocker"


# ----------------------------------------------------------------------------
# tmux help
# ----------------------------------------------------------------------------

bind -r ? \
    run-shell \
    'tmux new-window -n "help" "tmux list-keys -N | fzf"'


# ============================================================================
# THEME
# ============================================================================

source-file "$HOME/.config/tmuxconfig/themes/tmux-snapshot"


# ============================================================================
# PLUGINS
# ============================================================================

# ----------------------------------------------------------------------------
# TPM
# ----------------------------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH \
    "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'


# ----------------------------------------------------------------------------
# Resurrect
# ----------------------------------------------------------------------------

# Manual session persistence.
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Save:
#   Prefix + C-s
set -g @resurrect-save "C-s"

# Restore:
#   Prefix + C-r
set -g @resurrect-restore "C-r"


# ----------------------------------------------------------------------------
# Continuum
# ----------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore disabled intentionally.
set -g @continuum-restore 'off'

# Uncomment if automatic periodic saving is desired.
# set -g @continuum-save-interval '5'


# ============================================================================
# TMUX-FINGERS
# ============================================================================

set -g @plugin 'Morantron/tmux-fingers'


# ----------------------------------------------------------------------------
# File paths
# ----------------------------------------------------------------------------

set -g @fingers-pattern-1 \
    "(([.\\\w\\\-\~\\\$@]+)?(/[.\\\w\\\-@]+)+/?):\\\d+"

# Python error:
#   /path/script.py", line 10
set -g @fingers-pattern-2 \
    "(([.\\\w\\\-\~\\\$@]+)?(/[.\\\w\\\-@]+)+/?)\\\",\\\sline\\\s\\\d+"

# Python traceback:
#   File "script.py", line 10
set -g @fingers-pattern-3 \
    'File "([.\\\w\\\-\~/]+\\\.py)", line \\\d+'

# JavaScript / TypeScript:
#   at /home/user/app.js:15:20
set -g @fingers-pattern-4 \
    'at ([.\\\w\\\-\~/]+\\\.(js|ts|jsx|tsx|cjs|mjs)):\\\d+:\\\d+'

# C / C++ compiler output:
#   main.cpp:23:5
set -g @fingers-pattern-5 \
    '([.\\\w\\\-\~/]+\\\.(c|cpp|h|hpp)):\\\d+:\\\d+'

# URLs:
#   http://...
#   https://...
#   ftp://...
set -g @fingers-pattern-6 \
    '((https?|ftp):\\/\\/[^\\s"'\''<>]+)'


# ----------------------------------------------------------------------------
# Optional patterns
# ----------------------------------------------------------------------------

# Go stacktrace:
# /home/user/main.go:45 +0x123
#
# set -g @fingers-pattern-7 \
#     '([.\\\w\\\-\~/]+\\\.go):\\\d+(?:\\\s\\\+0x[0-9a-f]+)?'


# Python function definitions:
#
# set -g @fingers-pattern-8 \
#     '^\\\s\*def\\\s+([\\\w\_]+)\\\s\*\\\('


# Python class definitions:
#
# set -g @fingers-pattern-9 \
#     '^\\\s\*class\\\s+([\\\w\_]+)\\\s\*\\\(?'


# Python imports:
#
# set -g @fingers-pattern-10 \
#     '^\\\s\*(?:import|from)\\\s+([\\\w\\\.]+)'


# ----------------------------------------------------------------------------
# tmux-fingers key bindings
# ----------------------------------------------------------------------------

# Jump to selected target.
set -g @fingers-jump-key J

# Select target.
set -g @fingers-key F

# Alt action: jump to main pane.
set -g @fingers-alt-action \
    "$HOME/.config/miscxrdb/bin/tm-toggle-pane jump_to_main_pane"


# ============================================================================
# TPM START
# ============================================================================

# TPM must be initialized last.
run-shell "$HOME/.config/tmux/plugins/tpm/tpm"


# ============================================================================
# CUSTOM NAVI
# ============================================================================

run-shell "$XDG_CONFIG_HOME/miscxrdb/tmux/navi.tmux"


# ============================================================================
# END
# ============================================================================
